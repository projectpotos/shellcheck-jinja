---
name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write # go-semantic-release creates tags and GitHub releases
    uses: projectpotos/actions/.github/workflows/semantic-release.yaml@60001bf86fe665f84dfaedd1f6bc03073a11bea5 # v0.8.0
