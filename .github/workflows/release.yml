---
name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write # go-semantic-release creates tags and GitHub releases
    uses: projectpotos/actions/.github/workflows/semantic-release.yaml@cc9fa23313351dbc2443f830da4a111f96d293c6 # v0.2.2
