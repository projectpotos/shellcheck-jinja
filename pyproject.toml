[project]
name = "shellcheck-jinja"
version = "0.3.1"
description = "Render Jinja2 shell templates with fixture data and lint them with shellcheck."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ansible-core>=2.18",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "shellcheck-py>=0.10",
]

[project.scripts]
shellcheck-jinja = "shellcheck_jinja.cli:main"

[dependency-groups]
test = ["pytest==9.2.0", "pytest-cov==7.1.0"]
dev = [
    { include-group = "test" },
    "yamllint==1.38.0",
    "ruff==0.17.3",
    "pre-commit==4.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
source = ["shellcheck_jinja"]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == "__main__":']
fail_under = 95

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.format]
docstring-code-format = true
